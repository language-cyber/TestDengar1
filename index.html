<script>
    const sections = [{"id":1,"title":"Bhg 1 (S1-8)","count":8,"startId":1,"dialogue":"M1: Soalan-soalan 1 hingga 8\nM1: Anda akan mendengar beberapa rakaman ringkas.\nM1: Anda akan mendengar setiap rakaman sebanyak dua kali.\nM1: Bagi setiap soalan, tanda dalam kotak jawapan yang betul A, B, C atau D.\n\n(Jeda 3 saat.)\nM1: Rutin pagi Ammar selepas menghantar anak ke sekolah.\nM1: Soalan 1\nM1: Anda akan mendengar Ammar berkata:\nF1: Setiap pagi, setelah menghantar anak-anak ke sekolah, saya akan terus pulang ke rumah. Perjalanan tidaklah jauh, jadi cepat sahaja sampai.\nM1: Apakah tindakan Ammar seterusnya?\n(Jeda 3 saat.)\n\nM1: Soalan 2\nM1: Anda akan mendengar Ammar berkata:\nF1: Sebelum memulakan tugas di meja kerja, saya akan pastikan diri saya bersedia. Itu termasuklah menyediakan secawan kopi panas dan memastikan ruang kerja saya rapi dan selesa.\nM1: Apakah yang Ammar lakukan untuk persediaan?\n(Jeda 3 saat.)\n\nM1: Soalan 3\nM1: Anda akan mendengar Ammar berkata:\nF1: Rutin saya bermula dengan menyemak jadual dan membalas emel yang kritikal. Saya perlu fokus agar tugasan utama dapat diselesaikan segera.\nM1: Apakah prioriti kerja Ammar?\n(Jeda 3 saat.)\n\nM1: Soalan 4\nM1: Anda akan mendengar Ammar berkata:\nF1: Selalunya, saya akan membuat perancangan kerja untuk hari tersebut pada awal pagi. Ini membantu saya kekal teratur dan tidak terlepas sebarang perkara penting.\nM1: Apakah faedah merancang awal?\n(Jeda 3 saat.)\n\nM1: Soalan 5\nM1: Anda akan mendengar Ammar berkata:\nF1: Sekitar jam 10 pagi, saya akan berehat sebentar, mungkin berjalan-jalan di halaman rumah untuk meregangkan badan. Udara segar sungguh menyegarkan.\nM1: Mengapa Ammar berehat sebentar?\n(Jeda 3 saat.)\n\nM1: Soalan 6\nM1: Anda akan mendengar Ammar berkata:\nF1: Kadangkala, ada mesyuarat maya yang perlu saya hadiri. Penting untuk memastikan sambungan internet stabil agar perbincangan berjalan lancar.\nM1: Apakah keperluan mesyuarat maya?\n(Jeda 3 saat.)\n\nM1: Soalan 7\nM1: Anda akan mendengar Ammar berkata:\nF1: Menjelang tengah hari, saya akan mula memikirkan menu makan tengah hari. Selalunya saya memasak yang ringkas sahaja untuk jimat masa.\nM1: Apakah pilihan Ammar untuk makan tengah hari?\n(Jeda 3 saat.)\n\nM1: Soalan 8\nM1: Anda akan mendengar Ammar berkata:\nF1: Saya dapati bekerja dari rumah memberi saya kelonggaran masa. Ini membolehkan saya menguruskan hal peribadi dengan lebih baik, tanpa menjejaskan produktiviti.\nM1: Apakah kelebihan bekerja di rumah?\n(Jeda 3 saat.)","situation":"Setiap pagi, Ammar memulakan hari bekerjanya dari meja di rumah setelah menghantar anak ke sekolah.","questions":[{"id":1,"text":"Apakah tindakan Ammar seterusnya?","options":{"A":"Terus pulang.","B":"Beli makanan.","C":"Melawat jiran.","D":"Singgah kedai."},"correct":"A","evidence":"Setiap pagi, setelah menghantar anak-anak ke sekolah, saya akan terus pulang ke rumah."},{"id":2,"text":"Apakah yang Ammar lakukan untuk persediaan?","options":{"A":"Bersarapan berat.","B":"Mencari ilham.","C":"Menyedia minuman.","D":"Menukar pakaian."},"correct":"C","evidence":"Itu termasuklah menyediakan secawan kopi panas dan memastikan ruang kerja saya rapi dan selesa."},{"id":3,"text":"Apakah prioriti kerja Ammar?","options":{"A":"Merancang mesyuarat.","B":"Meneliti mel utama.","C":"Membaca berita.","D":"Mengemas bilik."},"correct":"B","evidence":"Rutin saya bermula dengan menyemak jadual dan membalas emel yang kritikal."},{"id":4,"text":"Apakah faedah merancang awal?","options":{"A":"Menghindari kekeliruan.","B":"Mengurangkan beban.","C":"Meluaskan kenalan.","D":"Mencari peluang."},"correct":"A","evidence":"Ini membantu saya kekal teratur dan tidak terlepas sebarang perkara penting."},{"id":5,"text":"Mengapa Ammar berehat sebentar?","options":{"A":"Mencari inspirasi.","B":"Membaca buku.","C":"Menjawab panggilan.","D":"Mengambil angin."},"correct":"D","evidence":"mungkin berjalan-jalan di halaman rumah untuk meregangkan badan. Udara segar sungguh menyegarkan."},{"id":6,"text":"Apakah keperluan mesyuarat maya?","options":{"A":"Internet kukuh.","B":"Peralatan canggih.","C":"Lokasi senyap.","D":"Laporan lengkap."},"correct":"A","evidence":"Penting untuk memastikan sambungan internet stabil agar perbincangan berjalan lancar."},{"id":7,"text":"Apakah pilihan Ammar untuk makan tengah hari?","options":{"A":"Pesanan segera.","B":"Menu mewah.","C":"Makanan ringkas.","D":"Makan di luar."},"correct":"C","evidence":"Selalunya saya memasak yang ringkas sahaja untuk jimat masa."},{"id":8,"text":"Apakah kelebihan bekerja di rumah?","options":{"A":"Mengurangkan tekanan.","B":"Mengendalikan hal peribadi.","C":"Menambah pendapatan.","D":"Mencipta suasana."},"correct":"B","evidence":"Ini membolehkan saya menguruskan hal peribadi dengan lebih baik, tanpa menjejaskan produktiviti."}],"audioUrl":"","audioBase64":""},{"id":2,"title":"Bhg 2 (S9-14)","count":6,"startId":9,"dialogue":"M1: Soalan-soalan 9 hingga 14\nM1: Anda akan mendengar satu pengumuman atau monolog.\nM1: Anda akan mendengar setiap rakaman sebanyak dua kali.\nM1: Bagi setiap soalan, tanda dalam kotak jawapan yang betul A, B, C atau D.\n\n(Jeda 3 saat.)\nM1: Pak Abu seorang petani yang rajin. Beliau menghabiskan awal paginya di sawah.\nM1: Soalan 9\nM1: Dengarkan cerita Pak Abu:\n\nF1: “Seawal fajar menyinsing, saya sudah berada di bendang. Udara pagi yang nyaman sungguh menyegarkan. Saya perlu memastikan anak-anak padi membesar dengan sihat dan bebas daripada ancaman perosak. Ini rutin saya setiap hari.”\n\nM1: Bilakah Pak Abu mula bekerja di sawah?\n(Jeda 3 saat.)\n\nM1: Soalan 10\nM1: Dengarkan cerita Pak Abu:\n\nF1: “Saya memeriksa setiap tangkai padi dengan teliti. Kadangkala ada daun yang kekuningan atau dapati kesan gigitan serangga. Jika ada, saya akan mencari jalan untuk mengatasinya sebelum merebak. Ini penting untuk memastikan hasil tanaman yang baik.”\n\nM1: Apakah yang sering diperhatikan Pak Abu?\n(Jeda 3 saat.)\n\nM1: Soalan 11\nM1: Dengarkan cerita Pak Abu:\n\nF1: “Selain memeriksa, saya juga memastikan paras air di petak sawah mencukupi. Terlalu banyak atau terlalu sedikit boleh menjejaskan pertumbuhan padi. Mengawal air adalah sebahagian daripada tanggungjawab saya.”\n\nM1: Apakah yang turut dipastikan Pak Abu?\n(Jeda 3 saat.)\n\nM1: Soalan 12\nM1: Dengarkan cerita Pak Abu:\n\nF1: “Apabila melihat tanaman padi saya subur menghijau, hati saya berasa sungguh lapang dan puas. Segala penat lelah terasa berbaloi. Inilah kebahagiaan seorang petani.”\n\nM1: Bagaimanakah perasaan Pak Abu melihat padinya?\n(Jeda 3 saat.)\n\nM1: Soalan 13\nM1: Dengarkan cerita Pak Abu:\n\nF1: “Setelah selesai menyemak kesemua petak, barulah saya akan pulang ke rumah. Matahari sudah mula naik tinggi sedikit, menandakan tibanya waktu untuk berehat.”\n\nM1: Ke manakah Pak Abu menuju selepas itu?\n(Jeda 3 saat.)\n\nM1: Soalan 14\nM1: Dengarkan cerita Pak Abu:\n\nF1: “Setibanya di rumah, isteri saya pasti sudah menyiapkan sarapan pagi yang enak. Tiada apa yang lebih nikmat daripada secawan kopi panas dan hidangan pagi selepas penat bekerja di sawah.”\n\nM1: Apakah yang menanti Pak Abu di rumah?\n(Jeda 3 saat.)","situation":"Pak Abu menyemak keadaan tanaman padi di sawah seawal fajar menyinsing sebelum kembali untuk sarapan.","questions":[{"id":9,"text":"Bilakah Pak Abu mula bekerja di sawah?","options":{"A":"Pada waktu subuh","B":"Selepas terbit matahari","C":"Menjelang tengah hari","D":"Selepas minum pagi"},"correct":"A","evidence":"Seawal fajar menyinsing, saya sudah berada di bendang."},{"id":10,"text":"Apakah yang sering diperhatikan Pak Abu?","options":{"A":"Kesan gigitan serangga","B":"Ketinggian batang","C":"Bentuk buah padi","D":"Jenis perosak lain"},"correct":"A","evidence":"Kadangkala ada daun yang kekuningan atau dapati kesan gigitan serangga."},{"id":11,"text":"Apakah yang turut dipastikan Pak Abu?","options":{"A":"Jenis baja digunakan","B":"Tahap air di sawah","C":"Kawasan padi baharu","D":"Keluasan petak sawah"},"correct":"B","evidence":"Saya juga memastikan paras air di petak sawah mencukupi."},{"id":12,"text":"Bagaimanakah perasaan Pak Abu melihat padinya?","options":{"A":"Berasa cemas","B":"Sangat kecewa","C":"Berasa puas","D":"Kurang bersemangat"},"correct":"C","evidence":"hati saya berasa sungguh lapang dan puas."},{"id":13,"text":"Ke manakah Pak Abu menuju selepas itu?","options":{"A":"Ke kedai kopi","B":"Pergi ke kebun","C":"Kembali ke rumah","D":"Berehat di bangsal"},"correct":"C","evidence":"barulah saya akan pulang ke rumah."},{"id":14,"text":"Apakah yang menanti Pak Abu di rumah?","options":{"A":"Tetamu datang","B":"Makanan pagi","C":"Tugas baharu","D":"Kerja menanti"},"correct":"B","evidence":"isteri saya pasti sudah menyiapkan sarapan pagi yang enak."}],"audioUrl":"","audioBase64":""},{"id":3,"title":"Bhg 3 (S15-19)","count":5,"startId":15,"dialogue":"M1: Soalan-soalan 15 hingga 19\nM1: Anda akan mendengar perbualan antara dua orang.\nM1: Anda akan mendengar setiap rakaman sebanyak dua kali.\nM1: Bagi setiap soalan, tanda dalam kotak jawapan yang betul A, B, C atau D.\n\n(Jeda 3 saat.)\nM1: Konteks Utama ringkas: Puan Aida dan Dr. Lee berbual tentang rutin harian Dr. Lee.\nM1: Soalan 15\nM1: Puan Aida bertanya. Puan Aida berkata:\nF1: Selamat pagi, Dr. Lee. Awak nampak penat. Adakah awak baru pulang dari kerja?\nM1: Apakah yang ingin diketahui oleh Puan Aida?\n(Jeda 3 saat.)\n\nM1: Soalan 16\nM1: Dr. Lee menjawab. Dr. Lee berkata:\nF1: Ya, Puan Aida. Saya baru tiba di rumah selepas bertugas syif malam di wad kecemasan. Saya selalunya pulang ke rumah pada waktu pagi begini.\nM1: Apakah pekerjaan Dr. Lee pada waktu malam?\n(Jeda 3 saat.)\n\nM1: Soalan 17\nM1: Puan Aida bertanya. Puan Aida berkata:\nF1: Oh, begitu. Jadi, bila pula awak biasanya tidur? Waktu siang tentulah sukar untuk tidur nyenyak.\nM1: Apakah kekangan tidur yang dibangkitkan oleh Puan Aida?\n(Jeda 3 saat.)\n\nM1: Soalan 18\nM1: Dr. Lee menjawab. Dr. Lee berkata:\nF1: Betul, Puan Aida. Saya perlu pastikan bilik gelap gelita dan senyap. Kadang-kadang saya guna penutup mata dan penyumbat telinga untuk memastikan saya dapat rehat yang cukup sebelum kembali bertugas.\nM1: Apakah strategi Dr. Lee untuk rehat yang berkualiti?\n(Jeda 3 saat.)\n\nM1: Soalan 19\nM1: Puan Aida bertanya. Puan Aida berkata:\nF1: Menariknya. Rutin awak memang mencabar. Bilakah awak meluangkan masa bersama keluarga dan melakukan aktiviti riadah?\nM1: Apakah fokus utama pertanyaan Puan Aida?\n(Jeda 3 saat.)","situation":"Dr. Lee menghabiskan waktu malamnya di wad kecemasan dan hanya pulang berehat pada waktu siang.","questions":[{"id":15,"text":"Apakah yang ingin diketahui oleh Puan Aida?","options":{"A":"Keadaan kesihatan","B":"Waktu kepulangan","C":"Jadual tugas","D":"Lokasi bekerja"},"correct":"B","evidence":"Adakah awak baru pulang dari kerja?"},{"id":16,"text":"Apakah pekerjaan Dr. Lee pada waktu malam?","options":{"A":"Menjaga wad","B":"Menulis laporan","C":"Merawat pesakit","D":"Membuat rondaan"},"correct":"C","evidence":"bertugas syif malam di wad kecemasan"},{"id":17,"text":"Apakah kekangan tidur yang dibangkitkan oleh Puan Aida?","options":{"A":"Gangguan bunyi","B":"Cahaya terang","C":"Suasana bising","D":"Kesukaran siang"},"correct":"D","evidence":"Waktu siang tentulah sukar untuk tidur nyenyak."},{"id":18,"text":"Apakah strategi Dr. Lee untuk rehat yang berkualiti?","options":{"A":"Kegelapan mutlak","B":"Ketenangan total","C":"Bantuan alat","D":"Kawal persekitaran"},"correct":"D","evidence":"Saya perlu pastikan bilik gelap gelita dan senyap. Kadang-kadang saya guna penutup mata dan penyumbat telinga."},{"id":19,"text":"Apakah fokus utama pertanyaan Puan Aida?","options":{"A":"Kehidupan peribadi","B":"Aktiviti keluarga","C":"Waktu lapang","D":"Cabaran tugas"},"correct":"C","evidence":"Bilakah awak meluangkan masa bersama keluarga dan melakukan aktiviti riadah?"}],"audioUrl":"","audioBase64":""},{"id":4,"title":"Bhg 4 (S20-28)","count":9,"startId":20,"dialogue":"M1: Soalan-soalan 20 hingga 28\nM1: Anda akan mendengar dua temu duga.\nM1: Anda akan mendengar setiap rakaman sebanyak dua kali.\nM1: Bagi setiap soalan, tanda dalam kotak jawapan yang betul A, B, C atau D.\n\n(Jeda 3 saat.)\nM1: Aisha sedang ditemu bual mengenai rutin harian pembelajarannya secara maya.\nM1: Soalan 20\nM1: Pewawancara bertanya kepada Aisha. Pewawancara berkata: \"Aisha, boleh ceritakan sedikit tentang rutin pagi kamu sebelum kelas maya bermula?\"\nF1: Aisha berkata: \"Oh, saya selalunya bangun seawal pukul 6:30 pagi setiap hari Isnin hingga Jumaat. Selepas bersiap, saya akan bersarapan sebelum membuka komputer.\"\nM1: Pukul berapakah Aisha bangun?\n(Jeda 3 saat.)\n\nM1: Soalan 21\nM1: Pewawancara bertanya kepada Aisha. Pewawancara berkata: \"Apakah persiapan awal yang kamu lakukan sebelum memulakan sesi kelas?\"\nF1: Aisha berkata: \"Selepas sarapan, saya akan pastikan sambungan internet saya stabil dan semua bahan pembelajaran seperti buku teks digital dan pautan kelas sudah tersedia. Saya juga akan memastikan tempat belajar saya kemas dan selesa.\"\nM1: Bagaimana Aisha bersiap sedia?\n(Jeda 3 saat.)\n\nM1: Soalan 22\nM1: Pewawancara bertanya kepada Aisha. Pewawancara berkata: \"Bagaimana pula dengan jadual kelas maya kamu? Subjek apa yang kamu pelajari?\"\nF1: Aisha berkata: \"Jadual kami padat. Dari jam 8:00 pagi hingga 1:00 tengah hari, kami ada tiga hingga empat subjek berbeza setiap hari. Contohnya, Bahasa Melayu, Matematik, Sains, dan Sejarah.\"\nM1: Berapa lama kelas berlangsung?\n(Jeda 3 saat.)\n\nM1: Soalan 23\nM1: Pewawancara bertanya kepada Aisha. Pewawancara berkata: \"Adakah kamu mempunyai waktu rehat antara kelas-kelas itu?\"\nF1: Aisha berkata: \"Ya, tentu sekali. Ada rehat pendek 15 minit antara setiap sesi dan satu rehat yang lebih panjang, kira-kira 45 minit, untuk makan tengah hari. Saya guna masa rehat itu untuk meregangkan badan dan minum air.\"\nM1: Apa dilakukan waktu rehat?\n(Jeda 3 saat.)\n\nM1: Soalan 24\nM1: Pewawancara bertanya kepada Aisha. Pewawancara berkata: \"Setelah kelas maya tamat, apakah aktiviti yang kamu lakukan pada waktu petang?\"\nF1: Aisha berkata: \"Biasanya, selepas pukul 1:00 tengah hari, saya akan berehat sebentar. Kemudian, saya akan menyiapkan kerja rumah yang diberi oleh guru dan mengulang kaji pelajaran. Kalau ada masa, saya akan melukis atau membaca buku cerita.\"\nM1: Aktiviti petang Aisha ialah...\n(Jeda 3 saat.)\n\nM1: Soalan 25\nM1: Pewawancara bertanya kepada Aisha. Pewawancara berkata: \"Memandangkan kamu belajar di hadapan skrin komputer hampir setiap hari, bagaimana kamu menguruskan masa skrin?\"\nF1: Aisha berkata: \"Ibu bapa saya sangat mengambil berat tentang perkara ini. Mereka akan memastikan saya tidak terlalu lama di hadapan skrin selepas waktu kelas. Saya juga akan cuba membuat aktiviti luar bilik seperti berkebun atau membantu ibu di dapur.\"\nM1: Aisha mengurangkan masa skrin dengan...\n(Jeda 3 saat.)\n\nM1: Soalan 26\nM1: Pewawancara bertanya kepada Aisha. Pewawancara berkata: \"Apakah kelebihan pembelajaran maya ini pada pandangan kamu?\"\nF1: Aisha berkata: \"Saya rasa pembelajaran maya ini sangat fleksibel. Saya boleh belajar dari keselesaan rumah dan menjimatkan masa perjalanan ke sekolah. Selain itu, bahan rujukan juga mudah dicapai secara digital.\"\nM1: Kelebihan kelas maya ialah...\n(Jeda 3 saat.)\n\nM1: Soalan 27\nM1: Pewawancara bertanya kepada Aisha. Pewawancara berkata: \"Bagaimana ibu bapa kamu menyokong pembelajaran maya kamu?\"\nF1: Aisha berkata: \"Ibu bapa saya sentiasa memastikan saya mempunyai peralatan yang sesuai dan sambungan internet yang baik. Mereka juga sering memantau kemajuan pelajaran saya dan membantu jika ada masalah teknikal. Mereka juga menetapkan masa rehat yang teratur.\"\nM1: Ibu bapa Aisha membantu dengan...\n(Jeda 3 saat.)\n\nM1: Soalan 28\nM1: Pewawancara bertanya kepada Aisha. Pewawancara berkata: \"Adakah apa-apa cabaran yang kamu hadapi semasa pembelajaran maya ini?\"\nF1: Aisha berkata: \"Kadang-kadang, saya rasa sukar untuk kekal fokus apabila tiada interaksi fizikal dengan rakan-rakan. Internet juga boleh terputus sewaktu kelas, itu memang mencabar. Tapi, saya cuba berinteraksi secara aktif di dalam kelas dan bertanya kepada guru.\"\nM1: Cabaran utama Aisha ialah...\n(Jeda 3 saat.)","situation":"Aisha mengikuti kelas pembelajaran maya yang telah diatur oleh ibu bapanya setiap hari Isnin hingga Jumaat.","questions":[{"id":20,"text":"Pukul berapakah Aisha bangun?","options":{"A":"Pukul enam tiga puluh.","B":"Pukul tujuh pagi.","C":"Pukul lapan pagi.","D":"Pukul enam petang."},"correct":"A","evidence":"Oh, saya selalunya bangun seawal pukul 6:30 pagi setiap hari Isnin hingga Jumaat."},{"id":21,"text":"Bagaimana Aisha bersiap sedia?","options":{"A":"Sambungan diuji.","B":"Buku diteliti.","C":"Guru dipanggil.","D":"Rakan dijemput."},"correct":"A","evidence":"Selepas sarapan, saya akan pastikan sambungan internet saya stabil dan semua bahan pembelajaran seperti buku teks digital dan pautan kelas sudah tersedia."},{"id":22,"text":"Berapa lama kelas berlangsung?","options":{"A":"Tiga jam.","B":"Empat jam.","C":"Lima jam.","D":"Enam jam."},"correct":"C","evidence":"Dari jam 8:00 pagi hingga 1:00 tengah hari, kami ada tiga hingga empat subjek berbeza setiap hari."},{"id":23,"text":"Apa dilakukan waktu rehat?","options":{"A":"Makan dan minum.","B":"Tidur sebentar.","C":"Berbual rakan.","D":"Menonton TV."},"correct":"A","evidence":"Ada rehat pendek 15 minit antara setiap sesi dan satu rehat yang lebih panjang, kira-kira 45 minit, untuk makan tengah hari. Saya guna masa rehat itu untuk meregangkan badan dan minum air."},{"id":24,"text":"Aktiviti petang Aisha ialah...","options":{"A":"Menyelesaikan tugasan.","B":"Melawat jiran.","C":"Bersukan ria.","D":"Memasak makanan."},"correct":"A","evidence":"Kemudian, saya akan menyiapkan kerja rumah yang diberi oleh guru dan mengulang kaji pelajaran."},{"id":25,"text":"Aisha mengurangkan masa skrin dengan...","options":{"A":"Bersiar-siar.","B":"Tidur awal.","C":"Membaca buku.","D":"Berkebun."},"correct":"D","evidence":"Saya juga akan cuba membuat aktiviti luar bilik seperti berkebun atau membantu ibu di dapur."},{"id":26,"text":"Kelebihan kelas maya ialah...","options":{"A":"Jadual tetap.","B":"Persekitaran fleksibel.","C":"Interaksi guru.","D":"Bahan terhad."},"correct":"B","evidence":"Saya rasa pembelajaran maya ini sangat fleksibel. Saya boleh belajar dari keselesaan rumah dan menjimatkan masa perjalanan ke sekolah."},{"id":27,"text":"Ibu bapa Aisha membantu dengan...","options":{"A":"Menyediakan makanan.","B":"Mengajar subjek.","C":"Pemantauan berterusan.","D":"Mengambil cuti."},"correct":"C","evidence":"Mereka juga sering memantau kemajuan pelajaran saya dan membantu jika ada masalah teknikal."},{"id":28,"text":"Cabaran utama Aisha ialah...","options":{"A":"Ketiadaan buku.","B":"Kurang perhatian.","C":"Masa suntuk.","D":"Guru tiada."},"correct":"B","evidence":"Kadang-kadang, saya rasa sukar untuk kekal fokus apabila tiada interaksi fizikal dengan rakan-rakan."}],"audioUrl":"","audioBase64":""},{"id":5,"title":"Bhg 5 (S29-34)","count":6,"startId":29,"dialogue":"M1: Soalan-soalan 29 hingga 34\nM1: Anda akan mendengar satu dialog atau cerita pendek.\nM1: Anda akan mendengar setiap rakaman sebanyak dua kali.\nM1: Bagi setiap soalan, tanda dalam kotak jawapan yang betul A, B, C atau D.\n\n(Jeda 3 saat.)\nM1: Anda akan mendengar perbualan antara Hasnah dan anaknya, Laila, tentang rutin harian Puan Zaiton.\nM1: Soalan 29\nM1: Laila bertanya kepada Hasnah:\nF1: \"Ibu, saya hairanlah mengapa Puan Zaiton selalu bangun awal pagi? Saya selalu nampak lampu dapur rumahnya sudah menyala seawal jam 3 pagi.\"\nM1: Apakah yang menyebabkan Laila terkejut?\n(Jeda 3 saat.)\n\nM1: Soalan 30\nM1: Hasnah menjawab:\nF1: \"Oh, Puan Zaiton memang rajin. Beliau perlu bangun awal untuk menyediakan bahan-bahan masakan untuk gerai sarapannya. Cuba bayangkan, berapa banyak lauk-pauk yang perlu beliau sediakan untuk dijual?\"\nM1: Mengapakah Puan Zaiton bangun seawal pagi?\n(Jeda 3 saat.)\n\nM1: Soalan 31\nM1: Laila bertanya lagi:\nF1: \"Jadi, semua bahan seperti sayur-sayuran dan ayam, beliau bersihkan dan potong sendiri pada waktu itu?\"\nM1: Apakah persediaan bahan yang dilakukan Puan Zaiton?\n(Jeda 3 saat.)\n\nM1: Soalan 32\nM1: Hasnah berkata:\nF1: \"Betul sekali, Laila. Beliau memastikan semuanya segar dan bersih. Kadang-kadang, suaminya akan membantu juga, terutamanya jika ada tempahan istimewa.\"\nM1: Bilakah suami Puan Zaiton membantu?\n(Jeda 3 saat.)\n\nM1: Soalan 33\nM1: Laila bertanya:\nF1: \"Kasihan Puan Zaiton, pasti beliau penat. Adakah beliau mengambil rehat yang cukup?\"\nM1: Apakah perasaan Laila terhadap Puan Zaiton?\n(Jeda 3 saat.)\n\nM1: Soalan 34\nM1: Hasnah menjawab:\nF1: \"Itulah rutinnya. Walaupun penat, Puan Zaiton melakukannya dengan penuh semangat dan rasa tanggungjawab demi mencari rezeki. Beliau hanya akan berehat sebentar setelah semua hidangan siap dan gerai dibuka.\"\nM1: Apakah tujuan utama Puan Zaiton berkerja?\n(Jeda 3 saat.)","situation":"Puan Zaiton bangun lebih awal setiap hari untuk menyediakan bahan-bahan masakan bagi gerai sarapannya.","questions":[{"id":29,"text":"Apakah yang menyebabkan Laila terkejut?","options":{"A":"Waktu Puan Zaiton bangun.","B":"Lampu dapur menyala.","C":"Bau masakan awal pagi.","D":"Puan Zaiton penat."},"correct":"A","evidence":"\"mengapa Puan Zaiton selalu bangun awal pagi? Saya selalu nampak lampu dapur rumahnya sudah menyala seawal jam 3 pagi.\""},{"id":30,"text":"Mengapakah Puan Zaiton bangun seawal pagi?","options":{"A":"Gerai makan laris.","B":"Menyiapkan jualan.","C":"Tidak boleh tidur.","D":"Suka waktu pagi."},"correct":"B","evidence":"\"Beliau perlu bangun awal untuk menyediakan bahan-bahan masakan untuk gerai sarapannya.\""},{"id":31,"text":"Apakah persediaan bahan yang dilakukan Puan Zaiton?","options":{"A":"Memotong bahan.","B":"Menempah bahan.","C":"Membeli bahan.","D":"Membungkus bahan."},"correct":"A","evidence":"\"semua bahan seperti sayur-sayuran dan ayam, beliau bersihkan dan potong sendiri pada waktu itu?\""},{"id":32,"text":"Bilakah suami Puan Zaiton membantu?","options":{"A":"Secara kerap.","B":"Jika ada pesanan.","C":"Setiap pagi.","D":"Apabila cuti."},"correct":"B","evidence":"\"Kadang-kadang, suaminya akan membantu juga, terutamanya jika ada tempahan istimewa.\""},{"id":33,"text":"Apakah perasaan Laila terhadap Puan Zaiton?","options":{"A":"Hairan.","B":"Kagum.","C":"Simpati.","D":"Gembira."},"correct":"C","evidence":"\"Kasihan Puan Zaiton, pasti beliau penat.\""},{"id":34,"text":"Apakah tujuan utama Puan Zaiton berkerja?","options":{"A":"Kerana minat.","B":"Mendapatkan wang.","C":"Bantu suami.","D":"Suka memasak."},"correct":"B","evidence":"\"Puan Zaiton melakukannya dengan penuh semangat dan rasa tanggungjawab demi mencari rezeki.\""}],"audioUrl":"","audioBase64":""},{"id":6,"title":"Bhg 6 (S35-40)","count":6,"startId":35,"dialogue":"M1: Soalan-soalan 35 hingga 40\nM1: Anda akan mendengar satu temubual.\nM1: Anda akan mendengar setiap rakaman sebanyak dua kali.\nM1: Bagi setiap soalan, tanda dalam kotak jawapan yang betul A, B, C atau D.\n\n(Jeda 3 saat.)\nM1: Konteks utama: Temu bual tentang rutin larian Sarah pada waktu pagi.\nM1: Soalan 35\nM1: Penyampai bertanya kepada Sarah. Penyampai berkata: Sarah, kami difahamkan anda mempunyai rutin yang luar biasa, iaitu memulakan sesi larian sebelum matahari terbit. Boleh ceritakan sedikit mengenainya?\n\nF1: Sarah berkata: Betul. Setiap hari, seawal jam 5.30 pagi, saya sudah berada di trek. Ini adalah sebahagian daripada latihan harian saya. Saya lebih suka waktu ini kerana saya dapat menikmati udara yang lebih nyaman dan ketenangan sebelum kesibukan hari bermula.\n\nM1: Bilakah Sarah memulakan larian?\n(Jeda 3 saat.)\n\nM1: Soalan 36\nM1: Penyampai bertanya kepada Sarah. Penyampai berkata: Menarik sekali! Dan di manakah anda biasanya melakukan larian anda itu?\n\nF1: Sarah berkata: Saya selalu berlari di trek larian yang berdekatan dengan rumah saya. Ia adalah tempat yang selamat dan sesuai untuk latihan saya.\n\nM1: Di manakah Sarah berjoging?\n(Jeda 3 saat.)\n\nM1: Soalan 37\nM1: Penyampai bertanya kepada Sarah. Penyampai berkata: Mengapa anda memilih untuk berlari pada waktu yang begitu awal, sebelum subuh? Pasti ada sebab istimewanya.\n\nF1: Sarah berkata: Ada beberapa sebab. Selain daripada udara yang lebih segar, saya juga mendapati jalan raya masih lengang. Ini memberi saya ketenangan dan tumpuan penuh pada larian tanpa gangguan.\n\nM1: Apakah kelebihan berlari awal pagi?\n(Jeda 3 saat.)\n\nM1: Soalan 38\nM1: Penyampai bertanya kepada Sarah. Penyampai berkata: Jadi, apakah matlamat utama anda dengan latihan larian harian ini?\n\nF1: Sarah berkata: Matlamat utama saya adalah untuk meningkatkan daya tahan fizikal dan mempersiapkan diri untuk pertandingan larian maraton yang akan datang. Ia juga membantu menjaga kesihatan mental saya.\n\nM1: Apakah sasaran utama latihan Sarah?\n(Jeda 3 saat.)\n\nM1: Soalan 39\nM1: Penyampai bertanya kepada Sarah. Penyampai berkata: Ramai yang sukar untuk bangun seawal itu. Apa rahsia atau motivasi anda untuk konsisten?\n\nF1: Sarah berkata: Saya selalu membayangkan perasaan cergas dan bersemangat yang saya peroleh selepas setiap larian. Itu adalah pendorong utama saya untuk meninggalkan katil setiap pagi.\n\nM1: Apa motivasi Sarah bangun awal?\n(Jeda 3 saat.)\n\nM1: Soalan 40\nM1: Penyampai bertanya kepada Sarah. Penyampai berkata: Akhir sekali, boleh kongsi rutin anda selepas selesai larian?\n\nF1: Sarah berkata: Selepas larian, saya akan melakukan sesi regangan untuk menyejukkan otot. Kemudian, saya akan pulang untuk menikmati sarapan berkhasiat. Ini penting untuk pemulihan dan tenaga.\n\nM1: Apa aktiviti Sarah selepas larian?\n(Jeda 3 saat.)","situation":"Sebelum matahari terbit, Sarah sudah memulakan sesi lariannya di trek sebagai sebahagian daripada latihan hariannya.","questions":[{"id":35,"text":"Bilakah Sarah memulakan larian?","options":{"A":"Waktu pagi","B":"Subuh menjelang","C":"Tengah hari","D":"Lewat malam"},"correct":"B","evidence":"Setiap hari, seawal jam 5.30 pagi, saya sudah berada di trek."},{"id":36,"text":"Di manakah Sarah berjoging?","options":{"A":"Di lapangan","B":"Di padang","C":"Di stadium","D":"Di jalan"},"correct":"A","evidence":"Saya selalu berlari di trek larian yang berdekatan dengan rumah saya."},{"id":37,"text":"Apakah kelebihan berlari awal pagi?","options":{"A":"Udara nyaman","B":"Tiada kenderaan","C":"Cuaca sejuk","D":"Minda tenang"},"correct":"A","evidence":"Selain daripada udara yang lebih segar, saya juga mendapati jalan raya masih lengang."},{"id":38,"text":"Apakah sasaran utama latihan Sarah?","options":{"A":"Kurangkan berat","B":"Tingkat daya tahan","C":"Rehat minda","D":"Jaga kesihatan"},"correct":"B","evidence":"Matlamat utama saya adalah untuk meningkatkan daya tahan fizikal dan mempersiapkan diri untuk pertandingan larian maraton yang akan datang."},{"id":39,"text":"Apa motivasi Sarah bangun awal?","options":{"A":"Cuaca baik","B":"Suasana tenang","C":"Rasa cergas","D":"Waktu lapang"},"correct":"C","evidence":"Saya selalu membayangkan perasaan cergas dan bersemangat yang saya peroleh selepas setiap larian."},{"id":40,"text":"Apa aktiviti Sarah selepas larian?","options":{"A":"Regang otot","B":"Sarapan segera","C":"Mandi awal","D":"Berehat sebentar"},"correct":"A","evidence":"Selepas larian, saya akan melakukan sesi regangan untuk menyejukkan otot."}],"audioUrl":"","audioBase64":""}];
    let cur = 0;
    let ans = {};
    let submitted = false;
    let totalQuestions = 0;

    sections.forEach(s => {
        totalQuestions += (s.questions ? s.questions.length : 0);
    });
    document.getElementById('total-display').innerText = totalQuestions;

    function renderTabs() {
        let html = '';
        sections.forEach((s, idx) => {
            let activeClass = cur === idx 
                ? 'bg-indigo-600 text-white shadow-md scale-[1.02]' 
                : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50';
            
            let ansCount = 0;
            if(s.questions) {
                s.questions.forEach(q => { if(ans[q.id]) ansCount++; });
            }
            let statusDot = '';
            if(!submitted && ansCount > 0 && ansCount === s.questions.length) {
                statusDot = '<span class="inline-block w-2 h-2 rounded-full bg-emerald-400 ml-2"></span>';
            }

            html += '<button onclick="changeTab(' + idx + ')" class="px-5 py-3 rounded-2xl text-[10px] sm:text-xs font-black uppercase whitespace-nowrap transition-all ' + activeClass + '">' + s.title + statusDot + '</button>';
        });
        document.getElementById('tabs').innerHTML = html;
    }

    function changeTab(idx) {
        cur = idx;
        renderTabs();
        renderContent();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function save(id, v) {
        if(submitted) return;
        ans[id] = v;
        renderTabs(); 
        renderContent();
    }

    function submitQuiz() {
        if(Object.keys(ans).length < totalQuestions) {
            if(!confirm("Awak belum menjawab semua soalan. Teruskan untuk hantar?")) return;
        }
        submitted = true;
        let score = 0;
        sections.forEach(s => {
            (s.questions || []).forEach(q => {
                if(ans[q.id] === q.correct) score++;
            });
        });
        document.getElementById('score-display').innerText = score;
        renderTabs();
        renderContent();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderContent() {
        const s = sections[cur];
        const b = document.getElementById('box');
        let h = '<h2 class="text-2xl font-black mb-4 text-indigo-950 uppercase tracking-tight">' + s.title + '</h2>';
        
        if(s.situation) h += '<p class="text-sm font-medium text-slate-500 mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-100">' + s.situation + '</p>';
        
        if(s.audioUrl) {
            h += '<div class="bg-indigo-50 p-4 rounded-3xl mb-8 border border-indigo-100 shadow-inner">';
            h += '<div class="text-[10px] font-black text-indigo-600 uppercase mb-2 pl-2">Rakaman Audio IGCSE</div>';
            h += '<audio controls class="w-full h-10"><source src="' + s.audioUrl + '"></audio></div>';
        }
        
        if(s.questions && s.questions.length > 0) {
            s.questions.forEach((q) => {
                h += '<div class="mb-10">';
                h += '<p class="font-bold text-slate-800 mb-5 text-lg"><span class="text-indigo-600 font-black mr-1">' + q.id + '.</span> ' + q.text + '</p>';
                h += '<div class="grid gap-2">';
                
                Object.entries(q.options || {}).forEach(([k,v]) => {
                    if(v && v.trim() !== "") {
                        let isSelected = ans[q.id] === k;
                        let cl = 'opt-btn';
                        
                        if(submitted) {
                            if(q.correct === k) cl += ' correct shadow-md';
                            else if(isSelected) cl += ' wrong';
                            else cl += ' opacity-50'; 
                        } else if(isSelected) {
                            cl += ' selected shadow-sm';
                        }
                        
                        h += '<button onclick="save(' + q.id + ', \'' + k + '\')" class="' + cl + '" ' + (submitted ? 'disabled' : '') + '>';
                        h += '<span class="w-8 inline-block text-slate-400 font-black">' + k + '</span><span class="flex-1">' + v + '</span>';
                        if(submitted && q.correct === k) h += '<svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                        if(submitted && isSelected && q.correct !== k) h += '<svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                        h += '</button>';
                    }
                });
                
                if(submitted && q.evidence) {
                    h += '<div class="mt-4 p-4 bg-amber-50 rounded-2xl text-xs font-bold text-amber-800 border border-amber-200">💡 Bukti Transkrip: "' + q.evidence + '"</div>';
                }
                
                h += '</div></div>';
            });
        } else {
            h += '<div class="text-center py-10 text-slate-400 font-bold uppercase text-xs">Tiada soalan untuk bahagian ini.</div>';
        }
        
        if(!submitted && cur === sections.length - 1) {
            h += '<button onclick="submitQuiz()" class="w-full bg-emerald-500 text-white py-5 rounded-[1.5rem] font-black text-lg uppercase shadow-xl transition-all hover:bg-emerald-600 hover:scale-[1.02] mt-6 border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1">HANTAR JAWAPAN KESELURUHAN</button>';
        } else if (!submitted && cur < sections.length - 1) {
            h += '<button onclick="changeTab(' + (cur + 1) + ')" class="w-full bg-blue-500 text-white py-4 rounded-2xl font-black uppercase shadow-lg transition-all hover:bg-blue-600 mt-4 border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 flex items-center justify-center gap-2">Seterusnya: ' + sections[cur+1].title + ' <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>';
        } else if (submitted && cur === sections.length - 1) {
            h += '<div class="text-center p-8 bg-emerald-50 rounded-3xl border-2 border-emerald-200 mt-8 shadow-sm"><h3 class="text-2xl font-black text-emerald-600 uppercase mb-2">Tahniah! Ujian Tamat 🎉</h3><p class="text-sm text-emerald-800 font-medium">Anda mendapat <span class="font-black text-lg">' + document.getElementById('score-display').innerText + ' / ' + totalQuestions + '</span> markah.</p></div>';
        }
        
        b.innerHTML = h;
    }

    window.onload = () => {
        renderTabs();
        renderContent();
    };
</script>
